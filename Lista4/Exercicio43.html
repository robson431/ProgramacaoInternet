<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
.container{
    display: grid;
    grid-template-columns: 200px 200px 200px 200px;
    grid-template-rows: 200px 200px 200px 200px;
    gap: 10px;
}

.box-1{
    background-color: gray;
    grid-row-start: 1;
    grid-row-end: 1;

    grid-column-start: 1;
    grid-column-end: 3;
}
.box-2{
    background-color: gray;
    grid-row-start: 1;
    grid-row-end: 1;

    grid-column-start: 4;
}
.box-3{
    background-color: gray;
    grid-row-start: 2;
    grid-row-end: 4;

    grid-column-start: 1;
    grid-column-end: 1;
}


.Telinha{
    display: grid;

    grid-template-columns: 100px 100px 100px;
    grid-auto-rows: 100px 100px 100px;

    background-color: gray;
    grid-row-start: 2;
    grid-row-end: 4;

    grid-column-start: 2;
    grid-column-end: 5;
    
    justify-content: center;
    gap: 10px;
}

.box-E {
    background-color: yellow;
    grid-row-start: 1;
    grid-row-end: 2;

    grid-column-start: 1;
    grid-column-end: 2;
}
.box-F {
    background-color: yellow;
    grid-row-start: 1;
    grid-row-end: 2;

    grid-column-start: 2;
    grid-column-end: 3;
}

.box-G {
    background-color: yellow;
    grid-row-start: 1;
    grid-row-end: 2;

    grid-column-start: 3;
    grid-column-end: 4;
}

.box-H {
    background-color: yellow;
    grid-row-start: 2;
    grid-row-end: 3;

    grid-column-start: 1;
    grid-column-end: 2;
}

.box-I {
    background-color: yellow;
    grid-row-start: 2;
    grid-row-end: 3;

    grid-column-start: 2;
    grid-column-end: 3;
}

.box-J {
    background-color: yellow;
    grid-row-start: 2;
    grid-row-end: 3;

    grid-column-start: 3;
    grid-column-end: 4;
}


span{
    color: white;
    font-size: 2em;
}


</style>



<!--Nao consegui ajeitar todas as letras pois ele fica indo muito para o lado-->


<body>
    
<div class="container">

    <div class="box-1"><span>A</span></div>
    <div class="box-2"><span>B</span></div>
    <div></div>
    <div class="box-3"><span>C</span></div>

    <div class="Telinha">

        <div class="box-E"><span>E</span></div>
        <div class="box-F"><span>F</span></div>
        <div class="box-G"><span>G</span></div>
        <div class="box-H"><span>H</span></div>
        <div class="box-I"><span>I</span></div>
        <div class="box-J"><span>J</span></div>
    </div>

    </div>
</body>
</html>
