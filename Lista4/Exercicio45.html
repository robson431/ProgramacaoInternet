<style>
.container{
    display: grid;
    grid-template-rows: 200px 200px 200px 200px 200px 200px;    
    grid-template-columns: 200px 200px 200px 200px 200px 200px;
}

        background-color: red;
        grid-row-start: 1;
        grid-row-end: 2;

        grid-column-start: 1;
        grid-column-end: 3;
    }
    #box-2{
        background-color: aqua;
        grid-row-start: 3;
        grid-row-end: 1;

        grid-column-start: 3;

    }

    #box-3{
        width: 600px;
        background-color: yellow;
        grid-row-start: 1;
        grid-row-end: 2;

        grid-column-start: 4;
        grid-column-end: 6;
    }
    #box-4{
        background-color: cadetblue;

        grid-column-start: 1;

    }

        width: 600px;
        background-color: black;
        grid-row-start: 3;
        grid-row-end: 3;

    }
    #box-6{
        width: 400px;
        height: 300px;
        background-color: blueviolet;
        grid-row-start: 4;
        grid-row-end: 2;

        grid-column-end: 6;
      }

        height: 50px;

        grid-row-start: 2;
        grid-row-end: 2;

        grid-column-start: 6;

      }

        height: 50px;

        grid-column-start: 6;

      }
         #box-9{

        height: 50px;
        border-radius: 50%;
        background-color: brown;

        grid-row-start: 2;
        grid-row-end: 2;

        grid-column-start: 6;
         grid-column-end: 7;
    }
    @media screen and (max-width: 600px) {

    .container {
        display: flex;
        flex-direction: column;
    }

}
