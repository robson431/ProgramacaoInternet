<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>

    <style>
        .conteiner{
            display: flex;
        }
        #box1{
            background-color: purple;
            width: 100px;
            height: 100px;
            position: absolute;

            top: 10px;
            left: 10px;
        }
        #box2{
            background-color: green;
            width: 100px;
            height: 100px;
            position: absolute;
            
            top: 10px;
            right: 10px;
        }
        #box3{
            background-color: red;
            width: 100px;
            height: 100px;
            position: absolute;

            top: 40%;
            left: 45%;

        }
        #box4{
            background-color: yellow;
            width: 100px;
            height: 100px;
            position: absolute;

            left:  10px;
            bottom: 10px;
        }

        #box5{
            background-color: rgb(0, 0, 0);
            width: 100px;
            height: 100px;
            position: absolute;

            bottom: 10px;
            right: 10px;

        }
    

    </style>
</head>


<body>

    
         <div class="conteiner">
        <div id="box1" class="box">box1</div>
        <div id="box2" class="box">box2</div>
        <div id="box3" class="box">box3</div>
        <div id="box4" class="box">box4</div>
        <div id="box5" class ="box">box5</div>
    </div>
    
</body>
</html>
