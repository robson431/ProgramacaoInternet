<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>

    <input type="number" id="inicio">
    <input type="number" id="fim">
    <button onclick="verificar()">Verificar</button>

    <div id="Primos"></div>

    <script>
        function ehPrimo(n) {
            if (n < 2) {
                return false;
            }
            for (let i = 2; i < n; i++) {
                if (n % i == 0) {
                    return false;
                }
            }
            return true;
        }

        function verificar() {
            let inicio = parseInt(document.getElementById("inicio").value);
            let fim = parseInt(document.getElementById("fim").value);
            let resultado = document.getElementById("Primos");

            if (isNaN(inicio) || isNaN(fim)) {
                resultado.textContent = "Preencha os dois campos.";
                return;
            }

            if (inicio > fim) {
                let troca = inicio;
                inicio = fim;
                fim = troca;
            }

            let primos = [];

            for (let i = inicio; i <= fim; i++) {
                if (ehPrimo(i)) {
                    primos.push(i);
                }
            }

            resultado.textContent = primos.join(", ");
        }
    </script>

</body>
</html>
