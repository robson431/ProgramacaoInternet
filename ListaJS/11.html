<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <button id="BotaoAlerta">Clique aqui</button>
  <input type="text" id="textInput" placeholder="Digite algo">
  <div id="Divv">Passe o mouse aqui</div>
  <select id="colorSelect">
    <option value="">Escolha uma cor</option>
    <option value="blue">Azul</option>
    <option value="green">Verde</option>
    <option value="red">Vermelho</option>
  </select>

  <script>
    let botao = document.getElementById("BotaoAlerta");
    let texto = document.getElementById("textInput");
    let div = document.getElementById("Divv");
    let cor = document.getElementById("colorSelect");

    botao.onclick = function() {
      alert("Você clicou no botão!");
    }

    texto.onkeydown = function(e) {
      console.log(e.key); <!--Olhei no Claude tmb como se fazia, nao sabia como fazer aparecer no console -->
    }

    texto.onfocus = function() {
      texto.style.backgroundColor = "yellow";
    }

    texto.onblur = function() {
      texto.style.backgroundColor = "white";
    }

    div.onmouseover = function() {
      div.style.backgroundColor = "lightblue";
    }   

    div.onmouseout = function() {
      div.style.backgroundColor = "white";
    }

    cor.onchange = function() {
      document.body.style.backgroundColor = cor.value;
    }
  </script>
</html>
